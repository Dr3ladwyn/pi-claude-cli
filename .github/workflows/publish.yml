name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing release tag on main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const tag = process.env.RELEASE_TAG;
          const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(tag);
          assert(match, "Release tag must be v followed by a valid semantic version");
          assert(!match[4]?.split(".").some(part => /^\d+$/.test(part) && part.length > 1 && part.startsWith("0")), "Numeric prerelease identifiers cannot have leading zeroes");
          NODE
          RELEASE_COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.commit }}

  build-distributions:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: npm ci
      - name: Build and qualify version-paired worker and Python distributions
        shell: bash
        run: |
          SCRATCH="$HOME/dev/agentic-scratchpads/pi-claude-cli/release/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$SCRATCH/t" "$SCRATCH/distributions/workers" "$SCRATCH/distributions/python"
          export TMPDIR="$SCRATCH/t"
          export PYTHONDONTWRITEBYTECODE=1
          export HERMES_BUILD_DIR="$SCRATCH/worker"
          npm run build:hermes
          python tools/package-hermes-release.py "$HERMES_BUILD_DIR" "$SCRATCH/distributions/workers"
          python -m venv "$SCRATCH/build-env"
          "$SCRATCH/build-env/bin/python" -m pip install build==1.3.0 setuptools==80.9.0
          export HERMES_CLAUDE_BRIDGE_WORKER_MANIFEST="$SCRATCH/distributions/workers/worker-manifest.json"
          PYTHONPATH="$PWD/python" "$SCRATCH/build-env/bin/python" -m unittest discover -s tests/python -v
          "$SCRATCH/build-env/bin/python" -m build --sdist --outdir "$SCRATCH/distributions/python" python
          mkdir -p "$SCRATCH/sdist"
          python -m tarfile -e "$SCRATCH"/distributions/python/*.tar.gz "$SCRATCH/sdist"
          env -u HERMES_CLAUDE_BRIDGE_WORKER_MANIFEST "$SCRATCH/build-env/bin/python" -m build --wheel --outdir "$SCRATCH/distributions/python" "$SCRATCH"/sdist/*
          python -m venv "$SCRATCH/consumer"
          "$SCRATCH/consumer/bin/python" -m pip install --no-deps "$SCRATCH"/distributions/python/*.whl
          export HOME="$SCRATCH/consumer-home"
          export HERMES_CLAUDE_BRIDGE_CACHE="$SCRATCH/consumer-cache"
          mkdir -p "$HOME"
          "$SCRATCH/consumer/bin/hermes-claude-bridge" --help
          "$SCRATCH/consumer/bin/hermes-claude-bridge" setup --artifact "$SCRATCH"/distributions/workers/*.tar.gz
          "$SCRATCH/consumer/bin/hermes-claude-bridge" status | python -c 'import json, sys; assert json.load(sys.stdin)["workerReady"] is True'
      - uses: actions/upload-artifact@v4
        with:
          name: coordinated-distributions
          path: ~/dev/agentic-scratchpads/pi-claude-cli/release/${{ github.run_id }}-${{ github.run_attempt }}/distributions/
          if-no-files-found: error

  publish:
    needs: [prepare, verify, build-distributions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install and verify OIDC-capable npm
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const [major, minor] = process.versions.node.split(".").map(Number);
            assert(major > 22 || (major === 22 && minor >= 19), "Node >=22.19 is required");
          '
      - name: Validate release identity and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RELEASE_COMMIT" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, "Tag must match package version");
          assert.equal(pkg.name, "@ramarivera/pi-claude-cli", "Unexpected release package");
          assert.equal(process.env.GITHUB_REPOSITORY, "ramarivera/pi-claude-cli", "Unexpected release repository");
          assert.equal(pkg.repository.url, `https://github.com/${process.env.GITHUB_REPOSITORY}`, "npm repository must match OIDC repository");
          NODE
      - run: npm ci
      - name: Prove package matches the immutable tag and publish with OIDC
        run: |
          SCRATCH="$HOME/dev/agentic-scratchpads/pi-claude-cli/release/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$SCRATCH/source" "$SCRATCH/tag-pack"
          git worktree add --detach "$SCRATCH/tag" "$RELEASE_COMMIT"
          npm pack --ignore-scripts --pack-destination "$SCRATCH/source" --json > "$SCRATCH/source/pack.json"
          (
            cd "$SCRATCH/tag"
            npm pack --ignore-scripts --pack-destination "$SCRATCH/tag-pack" --json > "$SCRATCH/tag-pack/pack.json"
          )
          PACKAGE_FILE=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename)' "$SCRATCH/source/pack.json")
          TAG_PACKAGE_FILE=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename)' "$SCRATCH/tag-pack/pack.json")
          cmp "$SCRATCH/source/$PACKAGE_FILE" "$SCRATCH/tag-pack/$TAG_PACKAGE_FILE"
          npm publish "$SCRATCH/source/$PACKAGE_FILE" --access public

  release:
    needs: [prepare, publish, build-distributions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: coordinated-distributions
          path: release-dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-dist/workers/*
            release-dist/python/*

  publish-python:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coordinated-distributions
          path: release-dist
      - name: Publish Python distributions using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release-dist/python/
