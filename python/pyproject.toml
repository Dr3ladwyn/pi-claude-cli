[project]
name = "hermes-claude-bridge"
version = "0.5.1"
description = "Hermes provider plugin for the pi-claude-cli Claude worker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Source = "https://github.com/ramarivera/pi-claude-cli"
Issues = "https://github.com/ramarivera/pi-claude-cli/issues"
[project.scripts]
hermes-claude-bridge = "hermes_claude_bridge.cli:main"

[project.entry-points."hermes_agent.plugins"]
pi-claude-cli = "hermes_claude_bridge.provider:profile"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
